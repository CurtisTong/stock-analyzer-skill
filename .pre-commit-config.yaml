# Pre-commit hooks（Sprint 7 工程化债清理）
# 安装: pip install pre-commit
# 启用: pre-commit install
# 手动跑: pre-commit run --all-files

repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [--fast, --target-version=py311]
        files: ^(scripts|experts|tests)/.*\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--line-length=120, --fix]
        files: ^(scripts|experts|tests)/.*\.py$

  - repo: local
    hooks:
      - id: pytest-quick
        name: 快速核心测试（pre-commit，<5s）
        # 跑 tests/integration/test_screening_service.py（核心业务服务）
        # 与 tests/integration/test_screener_pipeline.py（选股管道）
        # 完整测试见 pytest-sprint-tests（manual 阶段）
        entry: python3 -m pytest tests/integration/test_screening_service.py tests/integration/test_screener_pipeline.py -x -q -m "not network"
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: pytest-sprint-tests
        name: 跑核心 sprint 测试（manual 阶段）
        entry: python3 -m pytest tests/integration/ tests/contracts/ -x -q -m "not network"
        language: system
        pass_filenames: false
        types: [python]
        stages: [manual]

      - id: sync-skill-test-versions
        name: 同步 SKILL.md 版本到 test_skill_metadata.py
        # bump package.json 后自动同步测试常量，避免 release CI 阻塞
        entry: python3 scripts/dev/sync_skill_test_versions.py
        language: system
        pass_filenames: false
        files: ^(package\.json|skills/.*/SKILL\.md)$
        stages: [pre-commit]

      - id: check-skill-test-versions
        name: 检查 SKILL.md 版本与测试常量一致
        # 提交前门禁：检测 sync 后的文件是否已 git add
        entry: python3 scripts/dev/sync_skill_test_versions.py --check
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      # === v1.16.0 Batch 1.5 新增 4 个 CI 镜像 local hook ===
      - id: mypy-allowlist
        name: mypy 类型检查（CI 6 脚本 + 11 目录白名单）
        # CI 中跑同批文件，开发时本地镜像
        # v1.16.0 修复：与 .github/workflows/ci.yml mypy step 完全一致
        # 必须加 --follow-imports=silent --no-incremental，否则 mypy 会
        # 把 scripts/macro_indicators.py 既当独立脚本又当 scripts.* 包成员，
        # 报 "Source file found twice under different module names"。
        # v2.7 #1（2026-08-12）：common/ 已清零，随后 fetchers/business 也清零，
        # 2026-08-13 扩展 technical/strategies/data/portfolio/monitor/backtest/config/dev/chan，
        # 全部纳入白名单防回归（白名单命令与 ci.yml 保持一字不差）
        # 注：顶层 scripts/chan.py 兼容层与 chan/ 包同名（mypy 双身份限制）无法同列白名单，
        #    由 chan/ 目录扫描覆盖其逻辑
        entry: python3 -m mypy --follow-imports=silent --no-incremental scripts/market_anchor.py scripts/sector_etf_strength.py scripts/industry_beta.py scripts/portfolio_correlation.py scripts/macro_indicators.py scripts/common/ scripts/fetchers/ scripts/business/ scripts/technical/ scripts/strategies/ scripts/data/ scripts/portfolio/ scripts/monitor/ scripts/backtest/ scripts/config/ scripts/dev/ scripts/chan/
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
        # 允许失败：本地未必装 mypy
        require_serial: false

      # === v2.7 #1 扩展：CLI 层类型检查（与 ci.yml mypy CLI 层 step 一字不差）===
      # 白名单核心命令检查 6 顶层脚本 + 11 目录；本命令独立检查 22 个顶层 CLI 脚本。
      # 顶层 technical.py/backtest.py/chan.py 与同名包目录并传会触发 mypy
      # "Duplicate module named" 双身份冲突，故目录与文件分层两条命令检查。
      - id: mypy-cli-layer
        name: mypy CLI 层类型检查（22 个顶层脚本）
        entry: python3 -m mypy --follow-imports=silent --no-incremental scripts/quote.py scripts/kline.py scripts/finance.py scripts/technical.py scripts/screener.py scripts/stock.py scripts/chip.py scripts/sector.py scripts/monitor.py scripts/sector_summary.py scripts/portfolio_web.py scripts/hot_rank.py scripts/market_breadth.py scripts/perf_bench.py scripts/snapshots.py scripts/multi_stock_backtest.py scripts/strategy_performance.py scripts/calibration.py scripts/calibration_backfill.py scripts/calibration_sync.py scripts/backtest.py scripts/chan.py
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
        require_serial: false

      - id: sync-version
        name: sync_version 版本一致性检查（CI 镜像）
        entry: python3 scripts/dev/sync_version.py --check
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: check-allowed-tools
        name: SKILL.md allowed-tools 路径校验（CI 镜像）
        entry: python3 scripts/dev/check_allowed_tools.py --ci
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: validate-contracts
        name: contracts schema 校验（CI 镜像）
        entry: python3 scripts/dev/validate_contracts.py
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit] 