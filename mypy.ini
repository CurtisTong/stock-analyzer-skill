[mypy]
# 全局配置：增量严格模式（仅对 common/ 子包启用 strict，其他模块宽松）
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

# 忽略第三方库的类型存根（可选依赖无 type stubs）
ignore_missing_imports = True

# 默认关闭 strict：scripts/ 顶层模块不符合 strict 要求（pre-existing 债），
# 仅 common.* 子包启用 strict（见下方 [mypy-common.*]）
strict = False
disallow_any_generics = False
disallow_untyped_defs = False
no_implicit_optional = False

# 关闭脚本模块的常见 mypy 错误类别，避免阻塞 PR（pre-existing 债清理见
# docs/review-issues.md v2.7.x 基建债第 1 项）。
# 以下错误多数源自历史代码缺类型注解/Optional 转换，单独修复工作量巨大。
disable_error_code = type-arg, no-untyped-def, no-untyped-call, no-any-return, var-annotated, index

# 增量白名单（v2.7 #1：common/ 已清零，2026-08-12 扩展到 fetchers/business）：
# CI（.github/workflows/ci.yml mypy step）与 pre-commit mypy-allowlist 保持一致。
# 仅检查白名单目录，其他 scripts/ 模块按 --follow-imports=silent 跳过。

# common.* 子包启用 strict
[mypy-common.*]
strict = True
disallow_untyped_defs = True
disallow_any_generics = True
no_implicit_optional = True

[mypy-fetchers.*]
strict = False

[mypy-business.*]
strict = False

# strategies / refresh_pool 是门面（re-export）模块：内部用
# `from .registry import X` 导入再对外暴露。mypy 默认 implicit_reexport=False
# 会报 "does not explicitly export"，与实际运行语义不符，显式开启。
[mypy-strategies.*]
implicit_reexport = True

[mypy-refresh_pool]
implicit_reexport = True

# 顶层 CLI 薄壳 re-export（从 data/ 层导入再暴露给其他脚本）：
# quote.get_quotes、screener.analyze_code、backtest.run_backtest 等。
# 这些脚本不在 CI 白名单命令中，仅被白名单内模块按 follow-imports 引用，
# 此配置保证隔离检查（python3 -m mypy scripts/<cli>.py）时语义一致。
[mypy-quote]
implicit_reexport = True

[mypy-screener]
implicit_reexport = True