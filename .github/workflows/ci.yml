name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 单元与集成测试
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    # P0-13: 测试命令单一来源（.github/workflows/test-suite.yml），
    # ci 与 release 复用同一套 pytest 参数，避免标准漂移。
    uses: ./.github/workflows/test-suite.yml
    with:
      python-version: ${{ matrix.python-version }}
      fail-under: 21

  checks:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置测试环境
        uses: ./.github/actions/setup-test

      - name: 安装 lint 工具
        run: pip install black ruff mypy

      - name: 版本一致性检查
        run: python3 scripts/dev/sync_version.py --check

      - name: SKILL.md 版本与测试常量一致性
        run: python3 scripts/dev/sync_skill_test_versions.py --check

      - name: allowed-tools 自审计
        run: python3 scripts/dev/check_allowed_tools.py --ci

      - name: 静默吞错 lint（v1.16.0 P1-2 治理）
        run: python3 scripts/dev/lint_silent_excepts.py

      - name: black 格式检查
        run: black --check scripts/ experts/ tests/

      - name: ruff 静态检查
        run: ruff check scripts/ experts/ tests/ --line-length=120

      - name: mypy 类型检查
        run: |
          mypy --follow-imports=silent --no-incremental \
            scripts/market_anchor.py \
            scripts/sector_etf_strength.py \
            scripts/industry_beta.py \
            scripts/portfolio_correlation.py \
            scripts/macro_indicators.py \
            scripts/common/ \
            scripts/fetchers/ \
            scripts/business/ \
            scripts/technical/ \
            scripts/strategies/ \
            scripts/data/ \
            scripts/portfolio/ \
            scripts/monitor/ \
            scripts/backtest/ \
            scripts/config/ \
            scripts/dev/ \
            scripts/chan/

      - name: mypy CLI 层类型检查
        run: |
          mypy --follow-imports=silent --no-incremental \
            scripts/quote.py \
            scripts/kline.py \
            scripts/finance.py \
            scripts/technical.py \
            scripts/screener.py \
            scripts/stock.py \
            scripts/chip.py \
            scripts/sector.py \
            scripts/monitor.py \
            scripts/sector_summary.py \
            scripts/portfolio_web.py \
            scripts/hot_rank.py \
            scripts/market_breadth.py \
            scripts/perf_bench.py \
            scripts/snapshots.py \
            scripts/multi_stock_backtest.py \
            scripts/strategy_performance.py \
            scripts/calibration.py \
            scripts/calibration_backfill.py \
            scripts/calibration_sync.py \
            scripts/backtest.py \
            scripts/chan.py

  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: 跑 install.sh 集成测试
        run: |
          chmod +x tests/integration/test_install.sh
          bash tests/integration/test_install.sh

  smoke:
    name: 冒烟测试
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: smoke-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: 设置测试环境
        uses: ./.github/actions/setup-test

      - name: 跑 install.sh 创建 .claude/skills/ symlink
        run: bash install.sh

      - name: 跑 smoke_test.sh
        run: |
          chmod +x tests/smoke_test.sh
          bash tests/smoke_test.sh

  contracts:
    name: Schema 契约校验
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: 设置测试环境
        uses: ./.github/actions/setup-test

      - name: 校验 contracts/*.schema.json
        run: |
          python3 scripts/dev/validate_contracts.py