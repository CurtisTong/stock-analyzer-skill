name: Test Suite (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python 版本"
        type: string
        required: true
      fail-under:
        description: "覆盖率门槛"
        type: string
        default: "30"

jobs:
  test:
    name: 单元与集成测试 (py${{ inputs.python-version }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置测试环境
        uses: ./.github/actions/setup-test
        with:
          python-version: ${{ inputs.python-version }}

      - name: 跑全量测试（unit + integration + contracts + e2e + dispatch）
        run: |
          python -m pytest tests/ \
            -q \
            --maxfail=10 \
            -m "not network" \
            --timeout=60 \
            -n auto \
            --durations=10 \
            --cov=scripts --cov=experts \
            --cov-fail-under=${{ inputs.fail-under }}
