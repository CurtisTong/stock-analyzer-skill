[project]
name = "stock-analyzer-skill"
version = "1.25.0"
description = "A-share stock analyzer Claude Code plugin"
requires-python = ">=3.11"

# 已知限制：akshare 是可选依赖（fetcher 层 try: import akshare 模式），
# 其传递依赖 py_mini_racer 在 Python 3.14 报 DeprecationWarning（_pack_ 无 _layout_），
# Python 3.19 起升级为 error。届时 akshare 导入会失败，HAS_AKSHARE=False，
# akshare 系列 fetcher 自动降级为不可用（不崩溃，但丢失该数据源）。
# 这是上游 py_mini_racer/akshare 的问题，项目无法直接修复；
# 可选依赖模式已隔离影响——未安装 akshare 的环境完全不受影响。
# 解决时机：等上游 py_mini_racer 发布适配 3.19 的版本后，用户升级即可。

[project.dependencies]
# 运行时仅需 stdlib + PyYAML（配置加载）——"零依赖"口径以本声明为准。
# 其余 HTTP/行情/分析能力均为可选 extras（见下），缺失时代码自动降级：
# requests 缺失时 common/http.py 走 stdlib http.client 兜底（能力降级不崩溃）；
# 可选 SDK（akshare/efinance 等）缺失时对应 fetcher 自动不可用。
PyYAML = ">=6.0"

[project.optional-dependencies.http]
# requests 可选增强：连接池复用 + 自动编码 + 重试；缺失时降级 stdlib http.client。
requests = ">=2.31"

[project.optional-dependencies.quote]
yfinance = ">=0.2"

[project.optional-dependencies.china]
akshare = ">=1.12"
efinance = ">=0.16"
tushare = ">=1.4"
baostock = ">=0.8"
pytdx = ">=1.64"

[project.optional-dependencies.analysis]
pandas = ">=2.0"
numpy = ">=1.24"

[project.optional-dependencies.test]
pytest = ">=8.0"
pytest-xdist = ">=3.0"
pytest-timeout = ">=2.0"
pytest-cov = ">=4.0"
hypothesis = ">=6.0"
requests = ">=2.31"  # 测试走 requests 增强路径（与 http extra 相同版本口径）
respx = ">=0.21"
jsonschema = ">=4.0"  # 合约测试（test_contracts_path）

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra --strict-markers"
markers = [
    "unit: 纯函数/单类单元测试",
    "integration: 跨模块集成测试",
    "e2e: 端到端 CLI 测试",
    "contracts: schema/yaml 合约测试",
    "slow: 慢速测试",
    "network: 需要真实网络访问（默认 skip）",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# 显式声明规则集（等价于 ruff 历史默认 E4/E7/E9/F）。
# 不写 select 会跟随各版本的默认值：ruff 0.17 扩容了默认集，同一份代码
# 从 0 报错变成 1326 条（I001/UP*/BLE001/RUF* 等），CI 与本地结论不一致。
select = ["E4", "E7", "E9", "F"]
# E402: module level import not at top of file — 项目内大量 forward reference 模式合法
# F401: unused-import — __init__.py re-export 模式有意为之
extend-ignore = [
    "E402",
    "F401",
]